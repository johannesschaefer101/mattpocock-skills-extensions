name: Bug report
description: Something in the sidebar is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw. A screenshot of the sidebar helps.
    validations:
      required: true
  - type: dropdown
    id: tracker
    attributes:
      label: Tracker
      options: [Local markdown (.scratch/), GitHub issues, Both]
    validations:
      required: true
  - type: textarea
    id: ticket
    attributes:
      label: A ticket or map file that shows it
      description: Paste the file with private details removed, if the bug is about how a ticket is read.
      render: markdown
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `claude --version`, the mod version from `/plugin`, and your OS and terminal.
      placeholder: "2.1.318 (Claude Code) · wayfinder-sidebar 0.1.0 · macOS 15 · iTerm 3.5"
    validations:
      required: true
